<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Bank</title></head>
<body>
<h2>Create Account</h2>
<form action="create" method="post">
    Account No: <input type="number" name="accNo" required>
    Name: <input type="text" name="name" required>
    Opening Balance: <input type="number" step="0.01" min="0" name="balance" required>
    <button>Create</button>
</form>

<h2>Deposit</h2>
<form action="deposit" method="post">
    Account No: <input type="number" name="accNo" required>
    Amount: <input type="number" step="0.01" min="0.01" name="amount" required>
    <button>Deposit</button>
</form>

<h2>Withdraw</h2>
<form action="withdraw" method="post">
    Account No: <input type="number" name="accNo" required>
    Amount: <input type="number" step="0.01" min="0.01" name="amount" required>
    <button>Withdraw</button>
</form>

<h2>Balance Enquiry</h2>
<form action="balance" method="post">
    Account No: <input type="number" name="accNo" required>
    <button>Check</button>
</form>
</body>
</html>
